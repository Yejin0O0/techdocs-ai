name: Sync backend to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: techdocs-ai-backend
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf_space
          cp -rf backend/. hf_space/
          cd hf_space
          git add .
          git diff --staged --quiet || git commit -m "Sync from GitHub: ${{ github.sha }}"
          git push
